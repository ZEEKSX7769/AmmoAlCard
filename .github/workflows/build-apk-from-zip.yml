name: Build AmmoAlCard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmmoAlCard-debug-apk
          path: |
            project/**/build/outputs/apk/**/*.apk
